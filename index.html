<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロシア語語彙</title>
<!-- アプリ化（ホーム画面に置く・電波なしで開く）のための指定。中身は manifest.webmanifest と sw.js -->
<meta name="theme-color" id="tc" content="#FFFFFF">
<!-- 配色の設定（明るさ・色）を、画面を描く前に当てる。ちらつき防止 -->
<script>try{var p=JSON.parse(localStorage.getItem('rv-prefs-v1'))||{},r=document.documentElement;if(p.look==='light'||p.look==='dark')r.dataset.theme=p.look;if(p.accent&&p.accent!=='mono')r.dataset.accent=p.accent;}catch(_){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator) addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});</script>
<style>
  /* 色。背景は白、文字は黒に近い無彩色（色みを付けない）。
     --accent＝選択中・主ボタンの色（設定の「カラー」で変わる。初期は文字と同じ黒）、--on-accent＝その上に載せる文字の色。
     赤（--red, --mask）は「隠す・答え」だけに使う。目印は灰色（--dim） */
  :root{
    --paper:#FFFFFF; --card:#FFFFFF; --ink:#111315; --ink2:#4A4F57;
    --dim:#8B9099; --rule:#E1E4E8; --hair:#EEF0F2;
    --red:#D92D20; --mask:#E03131; --ok:#1E8E5A; --hl:#FFE680;
    --accent:var(--acc-l,var(--ink)); --on-accent:#FFFFFF;
    --serif:Georgia,"Times New Roman",serif;
  }
  /* 暗い配色：端末が暗い設定のとき（「ライト」を選んでいなければ）と、「ダーク」を選んだとき */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#111214; --card:#1A1B1E; --ink:#F1F2F4; --ink2:#B3B8BF; --dim:#7C818A; --rule:#2C2E33; --hair:#222428;
      --red:#FF6B62; --mask:#C9362F; --ok:#4CC38A; --hl:#6B5A00;
      --accent:var(--acc-d,var(--ink)); --on-accent:#111214;
    }
  }
  :root[data-theme="dark"]{
      --paper:#111214; --card:#1A1B1E; --ink:#F1F2F4; --ink2:#B3B8BF; --dim:#7C818A; --rule:#2C2E33; --hair:#222428;
      --red:#FF6B62; --mask:#C9362F; --ok:#4CC38A; --hl:#6B5A00;
      --accent:var(--acc-d,var(--ink)); --on-accent:#111214;
  }
  /* 色の選択肢。明るい配色用（--acc-l）と暗い配色用（--acc-d）の組。見本の丸（.sw）にも同じ組を持たせる */
  .sw[data-acc="mono"]{--acc-l:var(--ink);--acc-d:var(--ink)}
  :root[data-accent="blue"],.sw[data-acc="blue"]{--acc-l:#1D6FE8;--acc-d:#7FB0FF}
  :root[data-accent="green"],.sw[data-acc="green"]{--acc-l:#12875A;--acc-d:#52C794}
  :root[data-accent="purple"],.sw[data-acc="purple"]{--acc-l:#6E48D8;--acc-d:#A996FF}
  :root[data-accent="orange"],.sw[data-acc="orange"]{--acc-l:#C2540A;--acc-d:#FF9F57}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  /* 下へ引っぱっても再読み込みしない（ブラウザらしい動きを消す） */
  html,body{margin:0;padding:0;overscroll-behavior-y:none}
  html{touch-action:manipulation}
  /* 文字をタップしても選択しない（Chrome の「タップして検索」が開いて Google の結果が出るのを防ぐ）。入力欄と書き出しの欄だけは選べる */
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Segoe UI",sans-serif;
    font-size:16px;line-height:1.5;padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  .hidden{display:none !important}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);overflow:hidden}
  .masthead{
    display:flex;align-items:baseline;gap:9px;padding:13px 0 9px;
    transition:margin-top .18s ease,opacity .18s ease;
  }
  body.scrolled .masthead{margin-top:-40px;opacity:0;pointer-events:none}
  .masthead h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0;letter-spacing:.01em}
  .masthead .who{margin-left:auto;max-width:50%;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .searchrow{display:flex;gap:6px;margin-bottom:8px}
  .search{position:relative;flex:1;min-width:0}
  .search input{
    width:100%;min-height:44px;padding:10px 42px 10px 38px;
    border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);
    font-family:var(--serif);font-size:16px;outline:none;transition:border-color .12s;
  }
  .search input:focus{border-color:var(--ink2)}
  .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:none;stroke:var(--dim);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
  .clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--dim);font-size:20px;width:40px;height:40px;cursor:pointer;line-height:1;display:none}
  .toolsbtn{
    flex:0 0 auto;width:48px;min-height:44px;padding:0;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);background:var(--card);color:var(--ink2);
    border-radius:3px;cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;
  }
  /* 三本線：真ん中の線に、上下の線を影で足す */
  .toolsbtn span{display:block;width:18px;height:2px;border-radius:1px;background:currentColor;box-shadow:0 -6px 0 currentColor,0 6px 0 currentColor;pointer-events:none}
  .toolsbtn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;min-height:40px;
    border:1px solid var(--rule);background:var(--card);color:var(--ink2);
    padding:0 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;
  }
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip .c{font-variant-numeric:tabular-nums;opacity:.55;margin-left:5px;font-size:13px}
  /* メニューの中は絵のボタン。オンのものは墨色で塗る。赤シートの「隠す面」「隠し方」は、絵そのものが今の状態を表す */
  .subbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding-bottom:8px}
  .tool{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:58px;padding:7px 0 5px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
    border-radius:3px;font-family:inherit;cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  }
  .tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .tool span{font-size:13px;line-height:1.2;white-space:nowrap}
  .tool .tv{font-family:var(--serif);font-weight:400;font-size:15px;line-height:22px}
  .tool:active{background:var(--rule)}
  .tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .tool .badge{position:absolute;top:4px;right:6px;font-style:normal;font-family:var(--serif);font-size:13px;line-height:1}
  .tool .badge:empty{display:none}
  #sndbtn[aria-pressed="true"] .off,#sndbtn[aria-pressed="false"] .on{display:none}
  /* 設定の画面：検索と品詞は使わないので隠す */
  body.setting .searchrow,body.setting #tools,body.setting .chips{display:none}
  body.setting .masthead{padding-bottom:13px}
  .toolrow{display:flex;gap:6px;margin-top:10px}
  .vol{display:flex;align-items:center;gap:12px;margin-top:4px}
  .vol span{flex:0 0 4.6em;font-size:13px;color:var(--ink2)}
  .vol .slide{flex:1;min-width:0}
  .name{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:16px;outline:none}
  .name:focus{border-color:var(--ink2)}
  /* カラーの設定：色の見本は丸。選んでいる色は太い輪で囲む */
  .swrow{display:flex;gap:10px;margin-top:12px}
  .sw{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--rule);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sw i{display:block;width:26px;height:26px;border-radius:50%;background:var(--acc-l,var(--ink))}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sw i{background:var(--acc-d,var(--ink))} }
  :root[data-theme="dark"] .sw i{background:var(--acc-d,var(--ink))}
  .sw[aria-pressed="true"]{border:2px solid var(--ink)}
  #sheetbar{grid-template-columns:repeat(7,minmax(0,1fr))}
  .toolrow .tool{flex:1;min-width:0;max-width:88px}
  .tool.th .tv{font-size:24px;line-height:1}
  #side[data-side="ru"] .l,#side[data-side="ja"] .r,#mask .mk{fill:var(--mask);stroke:var(--mask)}
  #mask .m-initial,#mask .m-count{display:none;stroke:#fff}
  #mask .m-count{stroke-width:2.4}
  #mask[data-mask="initial"] .m-initial,#mask[data-mask="count"] .m-count{display:inline}
  .mini{
    flex:1 1 30%;min-height:40px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
    padding:5px 6px;border-radius:3px;font-size:13px;line-height:1.3;font-family:inherit;cursor:pointer;
  }
  .mini:active{background:var(--rule)}
  /* 画面下の切り替えバー（親指が届く位置） */
  .modes{
    position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
    background:var(--paper);border-top:1px solid var(--rule);
    padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  }
  .mode{
    flex:1;max-width:232px;min-height:44px;border:1px solid var(--rule);border-left-width:0;
    background:var(--card);color:var(--ink2);font-size:14px;font-family:inherit;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .mode:first-child{border-left-width:1px;border-radius:3px 0 0 3px}
  .mode:last-child{border-radius:0 3px 3px 0}
  .mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* ---------- sections ---------- */
  .pos-title{
    display:flex;align-items:center;gap:9px;margin:30px 0 2px;
    font-size:13px;letter-spacing:.11em;color:var(--dim);
  }
  .pos-title::before{content:"";width:6px;height:6px;background:var(--dim);flex:0 0 6px}
  .pos-title::after{content:"";flex:1;height:1px;background:var(--rule)}
  details.grp{border-bottom:1px solid var(--rule)}
  details.grp>summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:12px 2px;font-size:14px;font-weight:500;
  }
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary::before{content:"+";font-family:var(--serif);color:var(--dim);font-size:15px;width:9px;flex:0 0 9px;text-align:center}
  details.grp[open]>summary::before{content:"–"}
  details.grp>summary .gname{flex:1}
  details.grp>summary .cnt{font-family:var(--serif);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:400}

  /* ---------- entries : 一覧＝索引レイアウト ---------- */
  ul.list{list-style:none;margin:0;padding:0 0 10px}
  ul.list li{
    display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) 40px;
    gap:0 10px;align-items:baseline;padding:0 0 0 20px;
  }
  ul.list li+li{border-top:1px solid var(--hair)}
  /* 覚え具合の印（行の左の余白に出す）：●＝苦手。間違えた回数が多いほど増える（3つまで）。✓＝図鑑に載った */
  ul.list li{position:relative}
  ul.list li[data-st]::before{position:absolute;left:5px;top:15px;font-size:7px;line-height:9px;color:var(--ink);white-space:pre;content:"●"}
  ul.list li[data-st="w2"]::before{content:"●\A●";top:11px}
  ul.list li[data-st="w3"]::before{content:"●\A●\A●";top:7px}
  ul.list li[data-st="ok"]::before{content:"✓";left:3px;top:10px;font-size:13px;line-height:20px;color:var(--dim)}
  body.sheet ul.list li[data-st]::before{left:4px;top:50%;transform:translateY(-50%)}
  .legend{font-size:13px;color:var(--dim);margin-top:14px}
  .legend b{font-weight:400;color:var(--ink)}
  details.grp>summary .wk{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:400;white-space:nowrap}
  details.grp>summary .wk::before{content:"●";font-size:7px;vertical-align:2px;margin-right:3px}
  .hd{min-width:0;padding:10px 0}
  .ru{font-family:var(--serif);font-size:15px;line-height:1.35}
  .ru .sl{color:var(--dim);padding:0 1px}
  .ja{color:var(--ink2);font-size:13px;line-height:1.45;padding:10px 0}
  mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
  .tip{
    grid-column:1 / -1;font-size:13px;line-height:1.7;color:var(--ink2);
    border-left:2px solid var(--rule);padding:1px 0 1px 9px;margin:0 0 9px;
  }
  .tip b{font-family:var(--serif);font-weight:400;color:var(--ink)}
  .tip .warn{color:var(--ink);font-weight:600}

  /* ---------- red sheet : カードレイアウト ---------- */
  body.sheet ul.list{padding:5px 0 12px;display:flex;flex-direction:column;gap:6px}
  body.sheet ul.list li{
    display:grid;grid-template-columns:minmax(0,1fr) 132px;
    align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--rule);border-radius:6px;
    padding:13px 14px;cursor:pointer;
    min-height:70px;                 /* めくっても高さが変わらないように確保 */
  }
  body.sheet .hd{padding:0}          /* 長い見出し語は自分の列の中で折り返す */
  body.sheet .ru{font-size:17px;line-height:1.3;word-break:break-word}
  body.sheet .ja{width:100%;font-size:13px;text-align:right;padding:0}
  body.sheet.hide-ja li:not(.rev) .ja,
  body.sheet.hide-ru li:not(.rev) .ru{
    background:var(--mask);border-radius:3px;color:transparent;font-size:0;
    padding:3px 8px;user-select:none;-webkit-user-select:none;
    display:inline-block;vertical-align:middle;white-space:nowrap;overflow:hidden;
  }
  body.sheet.mask-solid.hide-ja li:not(.rev) .ja,
  body.sheet.mask-initial.hide-ja li:not(.rev) .ja{width:100%;max-width:100%;min-height:26px}
  body.sheet.mask-solid.hide-ru li:not(.rev) .ru,
  body.sheet.mask-initial.hide-ru li:not(.rev) .ru{width:132px;max-width:132px;min-height:26px}
  body.sheet.mask-count.hide-ja li:not(.rev) .ja{max-width:100%;overflow:hidden}
  body.sheet.mask-initial.hide-ja li:not(.rev) .ja::before,
  body.sheet.mask-initial.hide-ru li:not(.rev) .ru::before{content:attr(data-ini);color:#fff;font-size:14px}
  body.sheet.mask-count.hide-ja li:not(.rev) .ja::before,
  body.sheet.mask-count.hide-ru li:not(.rev) .ru::before{content:attr(data-mask);color:rgba(255,255,255,.5);font-size:11px;letter-spacing:1px}
  body.sheet li:not(.rev) mark{background:transparent;color:transparent}
  body.sheet .tip{display:none}
  body.sheet li.rev .ja{color:var(--ink)}

  /* ---------- 書き出し ---------- */
  #exptxt{
    width:100%;border:1px solid var(--rule);border-radius:3px;background:var(--paper);
    color:var(--ink);font-family:var(--serif);font-size:13px;line-height:1.7;
    padding:9px 11px;resize:vertical;
  }
  .expfmt{display:flex;gap:6px;margin-bottom:8px}
  .expfmt .mini{flex:1}
  .expfmt .mini[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .exphint{margin:9px 0 0;font-size:13px;line-height:1.7;color:var(--dim)}
  .exphint b{color:var(--ink)}
  .expbtns{display:flex;gap:6px;margin-top:8px}
  .expbtns .mini{flex:1}

  /* ---------- 選択 ---------- */
  ul.list li.sel{box-shadow:inset 3px 0 0 var(--accent);background:var(--card)}
  body.selecting ul.list li{cursor:pointer;position:relative}
  body.selecting ul.list li::after{
    content:"";position:absolute;right:12px;top:20px;transform:translateY(-50%);
    width:15px;height:15px;border:1px solid var(--dim);border-radius:2px;
  }
  body.selecting ul.list li.sel::after{background:var(--accent);border-color:var(--accent)}
  body.sheet.selecting ul.list li{padding-right:40px}
  body.sheet.selecting ul.list li::after{top:50%}
  .gsel{display:none}
  body.selecting details.grp>summary{padding:4px 2px}
  body.selecting details.grp>summary .gsel{
    display:inline-flex;align-items:center;min-height:40px;
    border:1px solid var(--rule);background:var(--card);color:var(--ink2);
    padding:0 14px;border-radius:999px;font-size:13px;font-family:inherit;
    white-space:nowrap;cursor:pointer;
  }
  body.selecting details.grp>summary .gsel:active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* ---------- 読み上げと動画リンク ---------- */
  [data-say]{cursor:pointer}
  [data-say]:active{opacity:.55}
  /* 動画は行の右端に離して置く（語のタップと押し間違えないように）。赤シート・テスト・選択中は出さない */
  .vid{
    align-self:stretch;display:flex;align-items:center;justify-content:center;min-height:40px;
    color:var(--dim);font-size:11px;line-height:1;text-decoration:none;
  }
  .vid:active{color:var(--ink)}
  body.sheet .vid,body.quiz .vid,body.selecting .vid{display:none}
  span.vid{display:inline-flex;min-height:0;padding:0 3px}

  /* ---------- notes ---------- */
  .note{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:0;margin:10px 0;overflow:hidden}
  .note>summary,.note h4{
    margin:0;padding:12px 15px;font-size:13.5px;letter-spacing:.04em;color:var(--ink);
    font-weight:600;display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;
  }
  .note>summary::-webkit-details-marker{display:none}
  .note>summary::before{
    content:"+";font-family:var(--serif);color:var(--dim);font-size:15px;
    width:9px;flex:0 0 9px;text-align:center;line-height:1;
  }
  .note[open]>summary::before{content:"–"}
  .note[open]>summary{border-bottom:1px solid var(--rule)}
  .note h4{border-bottom:1px solid var(--rule)}

  .note .body{padding:13px 15px;font-size:13px;line-height:1.9}
  .note .body>p{margin:0 0 10px}
  .note .body>p:last-child{margin-bottom:0}
  .note .eg{
    margin:11px 0;padding:10px 13px;background:var(--paper);
    border-left:2px solid var(--dim);font-size:13px;line-height:1.85;
  }
  .note .eg b{font-family:var(--serif);font-weight:400;color:var(--ink)}
  .note ul{margin:0;padding-left:16px}
  .note li{margin-bottom:5px}
  .note li:last-child{margin-bottom:0}
  .note b{font-family:var(--serif);font-weight:400;color:var(--ink)}
  .note a{color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;opacity:.9;word-break:break-word}
  .note .src{display:block;margin-bottom:9px;line-height:1.65}
  .note .src:last-child{margin-bottom:0}

  /* ---------- quiz ---------- */
  .q-setup{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:17px;margin-top:20px}
  .q-setup h3{margin:0 0 4px;font-size:15px;font-weight:600}
  .q-setup p{margin:0 0 12px;font-size:13px;color:var(--ink2)}
  .q-setup p b{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:15px}
  .q-label{font-size:13px;letter-spacing:.08em;color:var(--dim);margin:14px 0 6px}
  .opts{display:flex;gap:6px}
  .opt{
    flex:1;min-height:44px;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);

  .q-label b{font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:0;color:var(--ink);margin-left:8px}

  .slide::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
  .slide::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}

  .sliderow .slide{flex:1;min-width:0}
  .sliderow .opt{flex:0 0 auto;padding:6px 16px}

  .go.sub{background:none;border:1px solid var(--rule);color:var(--ink2);margin-top:8px}

  .q-top b{font-family:var(--serif);font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
  .q-prog{height:2px;background:var(--rule);margin-bottom:18px}
  .q-prog.t{margin-bottom:6px}
  .q-prog i{display:block;height:100%;background:var(--accent);transition:width .22s ease}
  .q-card{
    background:var(--card);border:1px solid var(--rule);border-radius:4px;
    padding:38px 20px;text-align:center;min-height:200px;
    display:flex;flex-direction:column;justify-content:center;gap:15px;
  }
  .q-cat{font-size:13px;letter-spacing:.08em;color:var(--dim);order:3}
  .q-prompt{font-family:var(--serif);font-size:27px;line-height:1.3;word-break:break-word}
  .q-prompt.ja-side{font-family:inherit;font-size:22px}
  .q-ans{border-top:1px solid var(--hair);padding-top:15px;font-size:19px;color:var(--red)}
  .q-ans.ru-side{font-family:var(--serif)}
  .q-btns{display:flex;gap:7px;margin-top:11px}
  .q-btns button{flex:1;border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:14px;border-radius:3px;font-size:15px;font-family:inherit;cursor:pointer}
  .q-btns .ok{border-color:var(--ok);color:var(--ok)}
  .q-btns .ng{border-color:var(--red);color:var(--red)}
  .q-btns .reveal{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .q-hint{text-align:center;font-size:13px;color:var(--dim);margin-top:10px}

  .score-sub{text-align:center;font-size:13px;color:var(--ink2);margin-bottom:6px}
  .wrong-h{font-size:13px;letter-spacing:.08em;color:var(--red);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-top:22px}

  body.testing header,body.testing .modes{display:none}
  body.testing{padding-bottom:24px}
  body.testing .q-top{margin-top:12px}
  .q-bar{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
  .q-bar button{min-height:40px;padding:0 18px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:3px;font-size:13px;font-family:inherit;cursor:pointer}
  .q-bar button.arm,.mini.arm{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .rs{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
  .rs span{flex:1;min-width:0}
  .rs .mini{flex:0 0 auto;min-width:96px}
  .rs i{font-style:normal;font-family:var(--serif);color:var(--dim);font-variant-numeric:tabular-nums}
  .rs:first-of-type{border-top:0}
  .q-timer{height:4px;background:var(--rule);border-radius:2px;margin-bottom:14px;overflow:hidden}
  .q-timer i{display:block;height:100%;background:var(--ink2);transform-origin:left center}
  @keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  .q-combo{font-family:var(--serif);font-size:15px;color:var(--ink);animation:pop .28s ease}
  .q-gain{font-style:normal;font-family:var(--serif);color:var(--ok);margin-left:6px;display:inline-block;animation:pop .28s ease}
  .q-x2{align-self:center;font-size:13px;background:var(--hl);color:var(--ink);padding:3px 12px;border-radius:999px}
  .rank{font-family:var(--serif);font-size:88px;line-height:1;text-align:center;margin:6px 0 10px;animation:pop .4s ease}
  .rank-h{text-align:center;font-size:13px;letter-spacing:.08em;color:var(--dim);margin-top:24px}
  /* 日ごとの記録：カレンダー（1列＝1週間、上が月曜）。色が濃いほど判定が高い */
  .cal-m,.cal{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px}
  .cal-m{margin-top:10px;height:20px;font-size:13px;color:var(--dim)}
  .cal-m span{white-space:nowrap}

  .day.rB{opacity:.44}
  .day.rC{opacity:.24}

  .zk .num{font-family:var(--serif);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink2)}

  .bar{height:3px;background:var(--rule);border-radius:2px;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .empty{padding:44px 0;text-align:center;color:var(--dim);font-size:13.5px}

"брать / взять":"コア：手に取る。①取る②借りる（<b>взять книгу в библиотеке</b>）③引き受ける（<b>взять на себя</b>）④（乗り物を）拾う（<b>взять такси</b>）⑤（試験などに）受かる。変化：брать → <b>беру, берёшь</b>／взять → <b>возьму, возьмёшь</b>。",

"поднимать / поднять":"コア：上へ持っていく。①持ち上げる②上げる（<b>поднять цены</b>）③（問題を）提起する（<b>поднять вопрос</b>）④起こす（<b>поднять с постели</b>）。変化：поднять → <b>подниму, поднимешь</b>。",

"стоить":"コア：それだけの価値がある。①値段がする（<b>сколько стоит?</b>）②価値がある（<b>стоит посмотреть</b>＝見る価値がある）③（無人称で）～しさえすれば",

"смотреть / посмотреть":"コアは<b>視線を向ける</b>。смотреть фильм→смотреть на（～のほうを見る）→смотреть за детьми（子どもの面倒を見る。за＋造格）。変化：смотреть → <b>смотрю, смотришь</b>。",
"дело":"コア：なされること。①こと・事柄（<b>в чём дело?</b>＝どうしたの）②用事（<b>у меня дела</b>）③仕事・事業（<b>своё дело</b>＝自分の事業）④事件・訴訟（<b>уголовное дело</b>）⑤書類一式",
"лицо":"コア：おもて。①顔②人物（<b>должностное лицо</b>＝公職者）③（文法の）人称（<b>первое лицо</b>）④表面・正面（<b>лицом к лицу</b>＝面と向かって）",

"солёный":"コア：塩味。①しょっぱい②塩漬けの（<b>солёные огурцы</b>）③きわどい（<b>солёный анекдот</b>）",

"считать / посчитать":"コア：数え上げる。①数える②計算する③～とみなす（<b>считать его другом</b>＝彼を友人と考える。造格に注意）④意見を持つ（<b>я считаю, что…</b>）",
"переводить / перевести":"コア：向こう側へ移す。①翻訳する②移す・移動させる（<b>перевести часы</b>＝時計を直す）③送金する（<b>перевести деньги</b>）④渡らせる（<b>перевести через дорогу</b>）。変化：перевести → <b>переведу, переведёшь</b>。",

"заниматься":"コア：その事にかかりきる。<span class=\"warn\">＋造格。</span>①従事する（<b>заниматься экспортом</b>）②勉強する（<b>заниматься русским</b>）③（スポーツを）やる（<b>заниматься спортом</b>）",
"убирать / убрать":"コア：どける。①片付ける（<b>убрать комнату</b>）②取り除く（<b>убрать лишнее</b>）③収穫する（<b>убрать урожай</b>）。変化：убрать → <b>уберу, уберёшь</b>。",
"получать / получить":"コア：自分のところに来る。①受け取る（<b>получить письмо</b>）②得る（<b>получить образование</b>）③（結果を）出す。-ся 形 <b>получаться</b>＝うまくいく",
"представлять / представить":"コア：目の前に差し出す。①想像する（<b>представь себе</b>＝想像してみて）②紹介する（<b>представить гостя</b>）③代表する（<b>представлять компанию</b>）④提出する",
"служить / послужить":"コア：仕える。①勤務する（<b>служить в армии</b>）②役立つ・～の役目を果たす（<b>служить примером</b>。造格）③（教会で）礼拝を行う",
"становиться / стать":"コア：ある状態に入る。①～になる（<b>стать врачом</b>。造格）②立つ・位置につく③始める（<b>стать делать</b>＝～しはじめる）④（無人称で）～になった（<b>стало холодно</b>）。変化：стать → <b>стану, станешь</b>。",
"слово":"コア：ことば。①単語②発言（<b>дать слово</b>＝発言を許す／約束する）③約束（<b>сдержать слово</b>）④（文学作品の）辞",
"память":"コア：覚えていること。①記憶（<b>хорошая память</b>）②追憶・記念（<b>в память о ком-то</b>）③（機器の）メモリ。<span class='warn'>-ь で終わる女性名詞</span>。",
"внимание":"コア：意識を向けること。①注意（<b>обратить внимание на</b>）②配慮・気遣い（<b>спасибо за внимание</b>）",
"решение":"コア：片がついた状態。①決定（<b>принять решение</b>＝決定を下す）②解決（<b>решение проблемы</b>）③（問題の）答え",
"вопрос":"コア：問い。①質問（<b>задать вопрос</b>）②問題・課題（<b>решить вопрос</b>）③事柄（<b>по вопросам доставки</b>＝配送の件では）",
"срок":"コア：区切られた時。①期限（<b>в срок</b>＝期日どおりに）②期間（<b>срок службы</b>＝耐用年数）③刑期",

"jp|святилище":"コア：神を祀る場所。<span class='warn'>神社はふつう святилище</span>。храм だけだと寺院・教会も指すので、синтоистский храм と補うか святилище を使う。",
"jp|буддийский храм":"храм 単独では教会・神殿と紛れる。<span class='warn'>буддийский を必ず付ける</span>のが安全。монастырь は僧が住む寺。",
"jp|тории":"<span class='warn'>不変化・複数扱い</span>。тории стоят у входа。単数で「一基の鳥居」と言いたければ ворота-тории。説明：<b>Это ворота, которые стоят у входа в синтоистское святилище.</b>",
"jp|кимоно":"<span class='warn'>不変化・中性</span>。японское кимоно、в кимоно。複数も同形。татами・сумо・каратэ も同じ扱い。説明：<b>Это традиционная одежда, которую сегодня надевают по праздникам.</b>",
"jp|татами":"<span class='warn'>不変化</span>。数えるときは циновка татами のように普通名詞を添える。комната в шесть татами。説明：<b>Это плотный соломенный мат, которым покрывают пол в японской комнате.</b>",
"jp|сумо":"<span class='warn'>不変化・中性</span>。японское сумо、турнир по сумо。борьба сумо とも。説明：<b>Это японская борьба, в которой нужно вытолкнуть соперника из круга.</b>",
"jp|сакура":"<span class='warn'>変化する女性名詞</span>。цветение сакуры、под сакурой。「桜の花」は цветы сакуры。",
"jp|самурай":"男性名詞。<span class='warn'>複数生格は самураев</span>。эпоха самураев。説明：<b>Это воин, который служил своему князю.</b>",
"jp|гейша":"女性名詞。<span class='warn'>複数生格は гейш</span>。квартал гейш（花街）。説明：<b>Это артистка, которая развлекает гостей танцем, музыкой и беседой.</b>",
"jp|суши":"日本語からは суси が原音に近いが、<span class='warn'>ロシアで通用するのは суши</span>。不変化。",

"jp|икебана":"女性名詞で変化する（искусство икебаны）。同じ意味で цветочная композиция とも言える。説明：<b>Это искусство, в котором из цветов и веток составляют композиции.</b>",

"biz|запчасть":"<span class='warn'>複数生格は запчастей</span>。現場ではほぼ複数形 запчасти で使う。正式には запасная часть の略。<span class='warn'>-ь で終わる女性名詞</span>。",

"biz|погрузка":"積み込み。反対は выгрузка（積み降ろし）。<span class='warn'>求人票の業務内容にそのまま出る語</span>。погрузка на судно。",

"biz|Транссибирская магистраль":"略して <b>Транссиб</b>。シベリア鉄道。極東の港と欧露を結ぶ幹線で、貨物の陸送経路になる。",
"торговать":"<span class='warn'>＋造格＝何を商うか</span>（торговать лесом）。<span class='warn'>＋с＋造格＝誰と商うか</span>（торговать с Японией）。完了体はない。変化：торговать → <b>торгую, торгуешь</b>。",

"учиться / научиться":"<span class='warn'>＋与格＝何を学ぶか</span>（учиться новому＝新しいことを覚える）。「～するのを学ぶ」は＋不定形（научиться водить）。",
"замерзать / замёрзнуть":"凍る。港・川・海が主語になる（порт замерзает зимой）。人に使うと「凍えている」（я замёрз）。",
"играть / поиграть":"<span class='warn'>スポーツ・ゲームは в＋対格</span>（играть <b>в футбол</b>）、<span class='warn'>楽器は на＋前置格</span>（играть <b>на гитаре</b>）。ここを取り違えると通じない。",
"кататься / покататься":"<span class='warn'>на＋前置格。</span>кататься на лыжах／на коньках／на велосипеде。「乗って動く」全般で、スキーもスケートも自転車もこれ一語。",
"уметь / суметь":"<b>身につけた技能</b>としての「できる」。мочь（その場の可能）と別。Я <b>умею</b> водить（運転できる）／Я <b>не могу</b> сегодня（今日は無理）。＋不定形。",
"собираться / собраться":"<span class='warn'>＋不定形で「～するつもりだ」</span>。Я собираюсь поехать во Владивосток。хотеть より予定が固まっている含み。「集まる」の意味もある。変化：собраться → <b>соберусь, соберёшься</b>。",
"пробовать / попробовать":"<span class='warn'>＋不定形＝やってみる</span>（попробовать кататься на сноуборде）。<span class='warn'>＋対格＝味見する</span>（попробовать суши）。「してみたい」の中心になる語。変化：пробовать → <b>пробую, пробуешь</b>。",
"нести / носить":"定・不定の対。<b>нести</b>＝今まさに運んでいる、<b>носить</b>＝習慣的に運ぶ／<b>身につけている</b>（носить очки＝眼鏡をかけている）。写真描写では носить が出番。変化：нести → <b>несу, несёшь</b>。",
"надевать / надеть":"<span class='warn'>надеть ＋対格＝何を着る</span>（надеть куртку）。одеться は「自分が服を着る」。<b>надеть что, одеть кого</b> と覚える。変化：надеть → <b>надену, наденешь</b>。",
"снимать / снять":"コア：外して取り去る。①脱ぐ（снять куртку）②外す（снять очки）③撮影する（снять фильм）④借りる（снять квартиру）。変化：снять → <b>сниму, снимешь</b>。",
"выглядеть":"<span class='warn'>＋造格</span>（выглядеть усталым）、または как＋主格（выглядеть как студент）。不完了体のみ。写真の説明に使える。変化：выглядеть → <b>выгляжу, выглядишь</b>。",
"казаться / показаться":"<span class='warn'>＋造格</span>（он кажется добрым）。「～のように見える」。Кажется, что… の形なら断定を避ける言い方になる。変化：казаться → <b>кажусь, кажешься</b>。",
"висеть":"掛かっている状態。<b>На стене висит картина</b>（壁に絵が掛かっている）。絵や写真の説明で стоять・лежать と並んで頻出。変化：висеть → <b>вишу, висишь</b>。",
"болеть за":"<span class='warn'>за＋対格。</span>болеть за нашу команду（うちのチームを応援する）。болеть（病気になる）と同形だが、за があれば応援の意味。",
"выигрывать / выиграть":"<span class='warn'>誰に勝つかは у＋生格</span>（выиграть у Японии）。何を勝ち取るかは対格（выиграть матч）。проиграть も同じ形を取る。",
"гладить / погладить":"①なでる（гладить кота）②アイロンをかける（гладить рубашку）。同じ語で別の動作になるので、目的語で判断する。",
"отпускать / отпустить":"опускать（下ろす）と紛らわしい。<b>отпустить</b>＝握っていたものを放す・行かせる。<b>опустить</b>＝下へ下ろす。",
"стремиться":"「目指す・努力して向かう」。<span class='warn'>к＋与格</span>（стремиться к цели）または＋不定形。完了体はない。",
"cmd|слушай":"слушать の命令形。<b>聞いて</b>という指示。<span class='warn'>接続・談話タブの слушай（「ねえ」と呼びかける談話標識）と同形</span>で、文頭に置けば呼びかけ、動作の指示なら本来の意味になる。вы なら слушайте。",
"класть / положить":"<span class='warn'>置き方で動詞が変わる。</span><b>класть</b>＝横にして置く（положить книгу на стол）、<b>ставить</b>＝立てて置く（поставить стакан）、<b>вешать</b>＝掛ける（повесить куртку）。日本語はどれも「置く」なので、物の姿勢で選び直す必要がある。変化：класть → <b>кладу, кладёшь</b>。",
"ставить / поставить":"立てて置く。класть（横に置く）との対。<span class='warn'>поставить чайник</span>（やかんを火にかける）、поставить подпись（署名する）のように慣用も多い。",
"собирать / собрать":"①集める（собрать вещи）②<b>組み立てる</b>（собрать мебель）③収穫する。<span class='warn'>собираться（～するつもりだ）と語形が近い</span>ので、-ся の有無で読み分ける。変化：собрать → <b>соберу, соберёшь</b>。",
"разбирать / разобрать":"собирать の対。①分解する（разобрать двигатель）②整理する（разобрать документы）③聞き取る（не разобрал＝聞き取れなかった）。変化：разобрать → <b>разберу, разберёшь</b>。",
"доставать / достать":"①取り出す（достать из сумки）②<b>手に入れる</b>（достать билеты）。②は「苦労して入手する」という含みがあり、купить とは別。変化：доставать → <b>достаю, достаёшь</b>／достать → <b>достану, достанешь</b>。",
"рвать / порвать":"<span class='warn'>不規則。рву, рвёшь, рвут</span>。①破る（порвать бумагу）②もぎ取る（рвать цветы）。-ся 形 порваться は「破れる」。",
"печь / испечь":"<span class='warn'>不規則で子音交替がある。пеку, печёшь, печёт, пекут</span>。オーブンで焼くのが печь、フライパンなら жарить、湯で煮るなら варить。",
"нарезать":"<span class='warn'>不完了体と完了体が同じ綴り</span>で、アクセントと変化が違う。不完了体は最後の音節を強く読み、<b>нарезаю, нарезаешь</b>。完了体は真ん中の音節を強く読み、<b>нарежу, нарежешь</b>。表記では区別できないので、耳で覚えるしかない。",
"заменять / заменить":"交換する。<span class='warn'>＋対格＋на＋対格</span>（заменить деталь на новую）。または＋造格。запчасти の話で頻出。",
"красить / покрасить":"塗る。名詞 краска（塗料）と同根。<b>красить стены</b>（壁を塗る）。「化粧する」の краситься も同じ語。",
"стучать / постучать":"<span class='warn'>в＋対格</span>（стучать в дверь＝ドアをノックする）。音を立てて叩く動作全般。変化：стучать → <b>стучу, стучишь</b>。",
"давить / надавить":"面で押さえつける。<b>нажимать</b>（ボタンなど一点を押す）、<b>толкать</b>（押して動かす）と使い分ける。日本語の「押す」は3つに割れる。",
"сажать / посадить":"①植える（посадить дерево）②<b>座らせる</b>（посадить ребёнка）。自分が座る садиться / сесть との他動詞・自動詞の対。",
"смешивать / смешать":"混ぜる。<span class='warn'>мешать は「邪魔する」と「かき混ぜる」の両方の意味を持つ</span>ので、混ぜるとはっきり言いたいときは смешивать か перемешивать を使う。",
"подгорать / подгореть":"焦げる。гореть（燃える）に под- が付いた形。<b>Молоко подгорело</b>（牛乳が焦げついた）。",
"оказываться / оказаться":"<span class='warn'>接頭辞から意味が読めない代表格</span>。「～であることが判明する」。<b>Оказалось, что он уже уехал</b>（彼はもう出発していたと分かった）。丸ごと覚えるほかない。変化：оказаться → <b>окажусь, окажешься</b>。",
"заставлять / заставить":"<span class='warn'>＋対格＋不定形。</span>「無理に～させる」。ставить（置く）と同根だが意味は無関係。заставить его работать。もう一つ「物でふさぐ」の意味もある。",
"обращаться / обратиться":"①<b>к＋与格</b>＝人に呼びかける・相談する（обратиться к врачу）②<b>с＋造格</b>＝物を扱う（обращаться с техникой）。前置詞で意味が割れる。変化：обратиться → <b>обращусь, обратишься</b>（я の形で т が щ に替わる）。",
"занимать / занять":"①場所を占める（занять место）②<b>お金を借りる</b>（занять денег）。<span class='warn'>заниматься（従事する）とは別の語</span>として扱う。変化：занять → <b>займу, займёшь</b>。",
"попадать / попасть":"①命中する・入る（<b>Попал!</b>＝入った）②たどり着く（попасть в Москву）③陥る（попасть в беду）。в＋対格。シュートが決まったときの一語がこれ。変化：попасть → <b>попаду, попадёшь</b>。",
"хватает / хватит":"無人称で使う。<span class='warn'>足りないものは生格</span>（денег не хватает＝お金が足りない）。<b>Хватит!</b> 単独なら「もうやめろ」。хватать（つかむ）と同じ語だが別物として覚える。",
"бить / побить":"<span class='warn'>不規則。бью, бьёшь, бьют</span>。по＋与格で「～を打つ」（бить по воротам＝ゴールを狙って蹴る）。一回なら ударить。",
"кидать / кинуть":"бросать の口語版で、意味はほぼ同じ。会話では кидать のほうが多い。<b>Кинь мне мяч</b>（ボール投げて）。",
"метать / метнуть":"<span class='warn'>競技の投てき専用</span>。метать копьё（やり投げ）、метание диска。日常の「投げる」には使わない。変化：метать → <b>мечу, мечешь</b>。",
"забрасывать / забросить":"в＋対格で「中へ投げ入れる」。забросить мяч в корзину（バスケで決める）。забивать は得点全般、забросить は投げ入れる動作そのもの。",
"зависеть":"<span class='warn'>от＋生格。</span>完了体はない。Это зависит от погоды（天気次第だ）。返事に使える <b>Смотря по обстоятельствам</b> と併せて。変化：зависеть → <b>завишу, зависишь</b>。",
"состоять":"①<b>из＋生格</b>＝～から成る（состоять из трёх частей）②<b>в＋前置格</b>＝本質は～にある。完了体はない。変化：состоять → <b>состою, состоишь</b>。",
"принадлежать":"<span class='warn'>＋与格＝誰のものか</span>（книга принадлежит мне）。<b>к＋与格</b>なら「～に属する」（принадлежать к группе）。完了体はない。変化：принадлежать → <b>принадлежу, принадлежишь</b>。",
"жениться":"<span class='warn'>主語は男性。</span>жениться на＋前置格（на ней）。女性は <b>выходить замуж за＋対格</b>。двое なら поженились。不完了体と完了体が同形。",
"умирать / умереть":"от＋生格＝病気や原因で（умереть от болезни）。за＋対格＝～のために。<span class='warn'>過去形は умер, умерла</span> とアクセントが動く。変化：умереть → <b>умру, умрёшь</b>。",
"петь / спеть":"<span class='warn'>不規則。пою, поёшь, поют</span>。спеть песню。曲を「かける」のは включать。",
"врать / соврать":"<span class='warn'>不規則。вру, врёшь</span>。口語。改まった場面では обманывать（だます）や говорить неправду。",
"сниться / присниться":"<span class='warn'>＋与格＝誰が見るか</span>。<b>Мне снился странный сон</b>（変な夢を見た）。夢の内容が主語になる点が日本語と逆。",
"надоедать / надоесть":"<span class='warn'>＋与格。</span><b>Мне надоело</b>（もううんざりだ）。うんざりする側が与格、原因が主語。変化：надоесть → <b>надоем, надоешь … надоедят</b>（есть＝食べる と同じ型）。",
"значить":"「意味する」。完了体はない。<b>Что это значит?</b>（これはどういう意味ですか）はレッスンでそのまま使える。",
"cmd|иди сюда":"идти の命令形は иди。<span class='warn'>「行って」も「来て」も同じ形</span>で、сюда（こっちへ）／туда（あっちへ）で向きを示す。",
"cmd|стой":"стоять から。<b>Стой!</b> で「止まれ」。сидеть（座っている）→ сиди と混同しないこと。Стоп! も通じる。",
"cmd|держи":"①持って（держи крепко＝しっかり持って）②<b>はい、どうぞ</b>と物を差し出すときにも使う。вы なら Держите。",
"cmd|дай":"дать の命令形。<span class='warn'>不完了体の давай は「さあ」の意味に転用される</span>ので別物として扱う。丁寧に頼むなら Дайте, пожалуйста。",
"cmd|брось":"бросить から。一回投げるのが брось、<b>投げ続けて</b>なら不完了体の бросай。「やめろ」の意味にもなる（Брось курить）。",
"cmd|лови":"ловить から。投げる側が声をかけるときの決まり文句。<b>Лови!</b>＝「ほら、行くよ」。",
"cmd|не двигайся":"<span class='warn'>否定の命令は必ず不完了体</span>。Не двинься とは言わない。Не трогай（触らないで）、Не беги（走らないで）も同じ形。",
"cmd|перестань":"перестать から。<b>Хватит!</b>（もういい）もほぼ同義でよく使う。Прекрати! は強い言い方。",
"cmd|тише":"比較級だが単独で命令として働く。<b>Тише!</b>＝静かに。громче なら「もっと大きく」。",
"cmd|осторожно":"副詞だが単独で警告になる。<b>Осторожно!</b>＝危ない・気をつけて。Берегись! はもっと切迫した「どけ」。",
"cmd|давай":"①さあ（давай попробуем＝やってみよう）②<b>じゃあね</b>（電話の切り際。口語）③давай＋不完了体不定形＝しようよ。用法が広いので文脈で判断。",
"cmd|попробуй":"попробовать から。<b>Попробуй ещё раз</b>（もう一度やってみて）。「味見して」の意味にもなる。",
"быть":"変化：現在形はふつう使わない（「ある」の意味の есть だけが残る）。未来は <b>буду, будешь</b>。",
"жить / прожить":"変化：жить → <b>живу, живёшь</b>。",
"оставаться / остаться":"変化：оставаться → <b>остаюсь, остаёшься</b>／остаться → <b>останусь, останешься</b>。",
"сидеть":"変化：сидеть → <b>сижу, сидишь</b>。",
"садиться / сесть":"支配：行き先なので <span class='warn'>в／на＋対格</span>（сесть в автобус, сесть на стул）。座っている状態の сидеть は＋前置格。変化：сесть → <b>сяду, сядешь</b>。",
"стоять":"変化：стоять → <b>стою, стоишь</b>。3人称の стоит は стоить（値段がする）の стоит と同じ綴り。стоять は後ろの音節を、стоить は前の音節を強く読む。",
"вставать / встать":"変化：вставать → <b>встаю, встаёшь</b>／встать → <b>встану, встанешь</b>。",
"лежать":"変化：лежать → <b>лежу, лежишь</b>。",
"ложиться / лечь":"支配：行き先なので <span class='warn'>на／в＋対格</span>（лечь на диван）。横たわっている状態の лежать は＋前置格。変化：лечь → <b>лягу, ляжешь … лягут</b>。",
"спать / поспать":"変化：спать → <b>сплю, спишь</b>。",
"существовать":"変化：существовать → <b>существую, существуешь</b>。",
"ехать / ездить":"変化：ехать → <b>еду, едешь</b>。",
"приходить / прийти":"変化：прийти → <b>приду, придёшь</b>。",
"приезжать / приехать":"変化：приехать → <b>приеду, приедешь</b>。",
"уходить / уйти":"変化：уйти → <b>уйду, уйдёшь</b>。",
"уезжать / уехать":"変化：уехать → <b>уеду, уедешь</b>。",
"входить / войти":"変化：войти → <b>войду, войдёшь</b>。",
"выходить / выйти":"変化：выйти → <b>выйду, выйдешь</b>。",
"подходить / подойти":"支配：「近づく」は <span class='warn'>к＋与格</span>（подойти к окну）。「合う・似合う」は <span class='warn'>＋与格</span>（это мне подходит）。変化：подойти → <b>подойду, подойдёшь</b>。",
"переходить / перейти":"変化：перейти → <b>перейду, перейдёшь</b>。",
"бежать / бегать":"変化：бежать → <b>бегу, бежишь … бегут</b>。",
"лететь / летать":"変化：лететь → <b>лечу, летишь</b>。",
"плыть / плавать":"変化：плыть → <b>плыву, плывёшь</b>。",
"подниматься / подняться":"変化：подняться → <b>поднимусь, поднимешься</b>。",
"падать / упасть":"変化：упасть → <b>упаду, упадёшь</b>。",
"приседать / присесть":"変化：присесть → <b>присяду, присядешь</b>。",
"махать / помахать":"支配：<span class='warn'>＋造格</span>（махать рукой＝手を振る）。変化：махать → <b>машу, машешь</b>。",
"обнимать / обнять":"変化：обнять → <b>обниму, обнимешь</b>。",
"целовать / поцеловать":"変化：целовать → <b>целую, целуешь</b>。",
"указывать / указать":"変化：указать → <b>укажу, укажешь</b>。",
"дышать":"支配：<span class='warn'>＋造格</span>（дышать свежим воздухом＝新鮮な空気を吸う）。変化：дышать → <b>дышу, дышишь</b>。",
"танцевать / потанцевать":"変化：танцевать → <b>танцую, танцуешь</b>。",
"вести / водить":"変化：вести → <b>веду, ведёшь</b>。",
"везти / возить":"変化：везти → <b>везу, везёшь</b>。",
"приносить / принести":"変化：принести → <b>принесу, принесёшь</b>。",
"передавать / передать":"変化：передавать → <b>передаю, передаёшь</b>／передать → <b>передам, передашь … передадут</b>。",
"давать / дать":"変化：давать → <b>даю, даёшь</b>／дать → <b>дам, дашь, даст, дадим, дадите, дадут</b>。",
"нажимать / нажать":"変化：нажать → <b>нажму, нажмёшь</b>。",
"сжимать / сжать":"変化：сжать → <b>сожму, сожмёшь</b>。",
"трясти / потрясти":"変化：трясти → <b>трясу, трясёшь</b>。",
"тереть / потереть":"変化：тереть → <b>тру, трёшь</b>。",
"жать / пожать":"変化：жать → <b>жму, жмёшь</b>。",
"забивать / забить":"変化：забить → <b>забью, забьёшь</b>。",
"отбивать / отбить":"変化：отбить → <b>отобью, отобьёшь</b>。",
"тренироваться / потренироваться":"変化：тренироваться → <b>тренируюсь, тренируешься</b>。",
"соревноваться":"変化：соревноваться → <b>соревнуюсь, соревнуешься</b>。",
"побеждать / победить":"変化：победить には я の形がない。「私が勝つ」は <b>я одержу победу</b> か <b>я выиграю</b> と言い換える。",
"подавать / подать":"変化：подавать → <b>подаю, подаёшь</b>／подать → <b>подам, подашь … подадут</b>。",
"догонять / догнать":"変化：догнать → <b>догоню, догонишь</b>。",
"разминаться / размяться":"変化：размяться → <b>разомнусь, разомнёшься</b>。",
"отжиматься / отжаться":"変化：отжаться → <b>отожмусь, отожмёшься</b>。",
"финишировать":"変化：финишировать → <b>финиширую, финишируешь</b>。",
"разбивать / разбить":"変化：разбить → <b>разобью, разобьёшь</b>。",
"резать / разрезать":"変化：резать → <b>режу, режешь</b>。",
"шить / сшить":"変化：шить → <b>шью, шьёшь</b>／сшить → <b>сошью, сошьёшь</b>。",
"прибивать / прибить":"変化：прибить → <b>прибью, прибьёшь</b>。",
"рисовать / нарисовать":"変化：рисовать → <b>рисую, рисуешь</b>。",
"смазывать / смазать":"変化：смазать → <b>смажу, смажешь</b>。",
"поливать / полить":"変化：полить → <b>полью, польёшь</b>。",
"завязывать / завязать":"変化：завязать → <b>завяжу, завяжешь</b>。",

const out=document.getElementById('out');
const chips=document.getElementById('chips');
const qEl=document.getElementById('q');
const clr=document.getElementById('clr');
let filter='all', query='', mode='list', hideSide='ja', maskMode='solid', shuf=false, shufAll=false, selMode=false, tipSearch=false;
const SEL=new Set();

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 検索用にそろえる：小文字にして ё→е（1文字→1文字なので位置はずれない） */
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
/* 補足の中身（タグを外して norm したもの）。「補足も検索」がオンのときだけ使うので、要るときに作ってためておく */
const tipNorm=new Map();
function tipText(ru,pos){
  const k=pos+'|'+ru;
  if(!tipNorm.has(k)){ const t=tipFor(ru,pos); tipNorm.set(k,t?norm(plainText(t)):''); }
  return tipNorm.get(k);
}
/* 語 w が検索語 q（norm 済み）に当たるか。一覧・テスト・書き出しで共通 */
const hit=(w,q,pos)=>!q||norm(w[0]).includes(q)||norm(w[1]).includes(q)||(tipSearch&&tipText(w[0],pos).includes(q));
const count=p=>p.groups.reduce((n,g)=>n+g[1].length,0);
const TOTAL=D.reduce((n,p)=>n+count(p),0);
document.title='ロシア語語彙 '+TOTAL.toLocaleString('ja-JP');

// chips
const mk=(id,label,n)=>{
  const b=document.createElement('button');
  b.className='chip';b.dataset.id=id;
  b.innerHTML=esc(label)+(n?'<span class="c">'+n+'</span>':'');
  b.setAttribute('aria-pressed',id===filter);
  b.onclick=()=>{
    filter=id;quiz=null;
    [...chips.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===id));
    render();window.scrollTo({top:0});
  };
  chips.appendChild(b);
};
mk('all','すべて',TOTAL);
mk('weak','苦手',0);     // 苦手な語をまとめて見る。語数は描くたびに入れ直す（weakChip）
D.forEach(p=>mk(p.id,p.name,count(p)));
/* 「苦手」のボタンの語数を、今の記録に合わせる */
function weakChip(){
  const n=weakItems().length;
  chips.querySelector('[data-id="weak"]').innerHTML='苦手'+(n?'<span class="c">'+n+'</span>':'');
}

function hl(text,q){
  if(!q) return esc(text);
  const i=norm(text).indexOf(q);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function ruHtml(ru,q){
  return hl(ru,q).replace(/ \/ /g,' <span class="sl">/</span> ');
}
function bars(s){
  const n=Math.min([...s.replace(/\s/g,'')].length,14);
  return '■'.repeat(n);
}

function ylTerm(s){
  return s.split(' / ')[0].split('...')[0].replace(/＋.*$/,'').replace(/,/g,'').trim().replace(/\s+/g,'_');
}
function sayTerm(s){
  return s.split(' / ')[0].split('...')[0].replace(/＋.*$/,'').trim();
}
function tipFor(ru,pos){ return TIPS[(pos||'')+'|'+ru]||TIPS[ru]; }
/* 補足の中のロシア語の太字は、タップで読み上げられるようにする */
function tipHtml(t){
  return t.replace(/<b>([^<]*[а-яё][^<]*)<\/b>/gi,(m,s)=>'<b role="button" data-say="'+esc(s.replace(/…/g,','))+'">'+s+'</b>');
}
function rowHtml(w,q,pos){
  const k=(pos||'')+'|'+w[0], tip=tipFor(w[0],pos);
  const st=stOf(k);
  return '<li class="'+(SEL.has(k)?'sel':'')+'" data-k="'+esc(k)+'"'+(st?' data-st="'+st+'"':'')+'><div class="hd"><span class="ru" role="button" data-say="'+esc(sayTerm(w[0]))+'" data-ini="'+esc(w[0][0])+'" data-mask="'+bars(w[0])+'">'+ruHtml(w[0],q)+
    '</span></div>'+
    '<span class="ja" data-ini="'+esc(w[1][0])+'" data-mask="'+bars(w[1])+'">'+hl(w[1],q)+'</span>'+
    '<a class="vid" href="https://youglish.com/pronounce/'+encodeURIComponent(ylTerm(w[0]))+'/russian" target="_blank" rel="noopener" aria-label="動画（YouGlish）" title="動画（YouGlish）">▶</a>'+
    (tip?'<div class="tip">'+tipHtml(tip)+'</div>':'')+'</li>';
}
/* カテゴリ見出しの一括選択ボタン。ラベルは選択状況から決める */
function gsText(d){
  return d._items.every(w=>SEL.has(d._pos+'|'+w[0]))?'解除':'全選択';
}
function gsLabel(d){
  if(!d||!d._items) return;
  const b=d.querySelector('.gsel');
  if(b) b.textContent=gsText(d);
}
/* 開いたカテゴリだけ行を生成する（初期描画を軽くするため） */
function fill(d){
  if(d.dataset.done) return;
  d.dataset.done='1';
  const ul=document.createElement('ul');
  ul.className='list';
  ul.innerHTML=d._items.map(w=>rowHtml(w,d._q,d._pos)).join('');
  d.appendChild(ul);
}
function renderList(){
  const q=norm(query.trim());
  // 「苦手」：品詞をまたいで1本のリストにまとめる。よく間違える語（●が多い語）を上に並べる
  if(filter==='weak'){
    const items=weakItems().filter(x=>hit([x.ru,x.ja],q,x.pos));
    if(!items.length){ out.innerHTML='<div class="empty">'+(q?'「'+esc(query)+'」に一致する語はありません':'苦手な語はありません')+'</div>'; return; }
    if(mode==='sheet'&&(shuf||shufAll)) shuffle(items);
    else items.sort((a,b)=>(MISS[keyOf(b)]||0)-(MISS[keyOf(a)]||0));
    out.innerHTML='<div class="pos-title">苦手　'+items.length+'語</div><ul class="list">'+items.map(x=>rowHtml([x.ru,x.ja],q,x.pos)).join('')+'</ul>';
    return;
  }
  const plan=[];
  let shown=0;
  D.forEach(p=>{
    if(filter!=='all'&&filter!==p.id) return;
    const hits=p.groups.map(([t,ws])=>[t,ws.filter(w=>hit(w,q,p.id))]).filter(g=>g[1].length);
    if(!hits.length) return;
    hits.forEach(g=>shown+=g[1].length);
    plan.push([p,hits]);
  });
  if(!shown){ out.innerHTML='<div class="empty">「'+esc(query)+'」に一致する語はありません</div>'; return; }
  // 赤シートの「全体を混ぜる」：分類の見出しから当たりがつかないよう、見出しなしの1本のリストにする
  if(mode==='sheet'&&shufAll){
    const all=[];
    plan.forEach(([p,hits])=>hits.forEach(g=>g[1].forEach(w=>all.push([w,p.id]))));
    shuffle(all);
    out.innerHTML=legendHtml()+'<div class="pos-title">全体を混ぜた並び　'+all.length+'語</div><ul class="list">'+all.map(x=>rowHtml(x[0],q,x[1])).join('')+'</ul>';
    return;
  }
  const auto=!!q;
  const frag=document.createDocumentFragment();
  plan.forEach(([p,hits])=>{
    const h=document.createElement('div');
    h.className='pos-title';
    h.textContent=p.name;
    frag.appendChild(h);
    hits.forEach(([t,ws])=>{
      const d=document.createElement('details');
      d.className='grp';
      d._items=shuf?shuffle(ws.slice()):ws;
      d._q=q;
      d._pos=p.id;
      const wk=ws.filter(w=>(p.id+'|'+w[0]) in WEAK).length;     // この分類にある苦手な語の数（閉じたままでも分かるように）
      d.innerHTML='<summary><span class="gname">'+esc(t)+'</span><span class="gsel">'+gsText(d)+'</span>'+(wk?'<span class="wk">'+wk+'</span>':'')+'<span class="cnt">'+ws.length+'</span></summary>';
      d.addEventListener('toggle',()=>fill(d));
      if(auto){ d.open=true; fill(d); }
      frag.appendChild(d);
    });
  });
  out.innerHTML=legendHtml();
  out.appendChild(frag);
}

function plainText(s){
  return String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
}
function expData(){
  const items=expItems;
  if(expFmt==='anki'){
    // タブ区切り3フィールド：表 / 裏 / 注記
    return items.map(x=>[x.ru, x.ja, plainText(tipFor(x.ru,x.pos)||'')].join('\t')).join('\n');
  }
  return items.map(x=>x.ru+' — '+x.ja).join('\n');
}

/* ================= 端末に保存する記録（苦手・図鑑・日ごとの判定・設定） ================= */
const store={
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v&&typeof v==='object'?v:d; }catch(_){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
};
const WKEY='rv-weak-v1', MKEY='rv-miss-v1', ZKEY='rv-zukan-v1', DKEY='rv-daily-v1', PKEY='rv-prefs-v1';
const WEAK=store.get(WKEY,{});    // 苦手な語　　 {品詞id|ロシア語: 続けて「わかった」を押した回数}
const MISS=store.get(MKEY,{});    // 間違えた回数 {品詞id|ロシア語: 「あやふや」を押した回数の合計}
const ZUKAN=store.get(ZKEY,{});   // 図鑑　　　　 {品詞id|ロシア語: [最後に決めた日, 決めた日数]}
const DAILY=store.get(DKEY,{});   // 日ごとの判定 {日付: {r:判定, raw:点, ok:正解数, n:問題数, t:平均秒}}
const PREFS=Object.assign({limit:0,sv:5,tv:10,theme:1,name:'',look:'auto',accent:'mono'},store.get(PKEY,{}));   // limit＝制限時間（秒。0 はなし）、sv＝効果音の音量（0〜10。5 が標準）、tv＝読み上げの音量（0〜10）、theme＝効果音の種類（1〜3）、name＝名前、look＝明るさ（'auto' 端末に合わせる・'light'・'dark'）、accent＝選択中や主ボタンの色
if(PREFS.sound===false) PREFS.sv=0;     // 古い保存の形（効果音オフ）は音量 0 に直す
delete PREFS.sound;
/* 名前を見出しの右に出す（付けていなければ何も出さない） */
function whoLabel(){ document.getElementById('who').textContent=PREFS.name||''; }
whoLabel();
/* 配色を当てる（html に印を付けると CSS が切り替わる）。画面の上の帯の色も背景に合わせる */
function applyLook(){
  const r=document.documentElement;
  if(PREFS.look==='light'||PREFS.look==='dark') r.dataset.theme=PREFS.look; else delete r.dataset.theme;
  if(PREFS.accent&&PREFS.accent!=='mono') r.dataset.accent=PREFS.accent; else delete r.dataset.accent;
  document.getElementById('tc').content=getComputedStyle(r).getPropertyValue('--paper').trim()||'#FFFFFF';
}
applyLook();
try{ matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyLook); }catch(_){}
const LOOKS=[
  ['auto','自動','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>'],
  ['light','ライト','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>'],
  ['dark','ダーク','<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>']
];
const ACCENTS=['mono','blue','green','purple','orange'];
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());

/* 全語の一覧。記録のキーは「品詞id|ロシア語」（選択 SEL と同じ形） */
const ALL=[];
D.forEach(p=>p.groups.forEach(([cat,ws])=>ws.forEach(w=>ALL.push({ru:w[0],ja:w[1],cat:cat,pos:p.id}))));
const keyOf=x=>x.pos+'|'+x.ru;
const weakItems=()=>ALL.filter(x=>keyOf(x) in WEAK);
const inZukan=k=>!!ZUKAN[k]&&ZUKAN[k][1]>=2;
/* 一覧と赤シートに出す、覚え具合の印。w1〜w3＝苦手（間違えた回数。3回以上は w3）、ok＝図鑑に載った、空＝印なし */
function stOf(k){
  if(k in WEAK) return 'w'+Math.min(3,Math.max(1,MISS[k]||1));
  return inZukan(k)?'ok':'';
}
/* 印の説明。印が1つもないうちは出さない */
function legendHtml(){
  const w=Object.keys(WEAK).length, z=Object.keys(ZUKAN).some(inZukan);
  if(!w&&!z) return '';
  return '<div class="legend">'+(w?'<b>●</b> 苦手':'')+(w&&z?'　':'')+(z?'<b>✓</b> 図鑑':'')+'</div>';
}
/* 押し間違いを防ぐ2回押し：1回目はボタンを確認の表示に変えて false、数秒のうちにもう一度押されたら true を返す */
function twice(b,msg){
  if(b.classList.contains('arm')) return true;
  const t=b.textContent;
  b.classList.add('arm'); b.textContent=msg;
  setTimeout(()=>{ if(b.isConnected&&b.classList.contains('arm')){ b.classList.remove('arm'); b.textContent=t; } },2500);
  return false;
}

/* 設定の画面：アカウント（名前）、サウンド（音量・効果音の種類・読み上げの速さ）、カラー（明るさ・色）、記録、図鑑、初期化（「消す」は2回押すと実行）。
   画面には説明を書かない */
function renderSettings(){
  out.innerHTML=
    '<div class="q-setup"><h3>アカウント</h3>'+
      '<div class="vol"><span>名前</span><input class="name" id="uname" type="text" maxlength="20" autocomplete="off" aria-label="名前" value="'+esc(PREFS.name||'')+'"></div>'+
    '</div>'+
    '<div class="q-setup"><h3>サウンド</h3>'+
      '<div class="vol"><span>効果音</span><input class="slide" id="sv" type="range" min="0" max="10" step="1" aria-label="効果音の音量"></div>'+
      '<div class="vol"><span>読み上げ</span><input class="slide" id="tv" type="range" min="0" max="10" step="1" aria-label="読み上げの音量"></div>'+
      '<div class="toolrow" id="sndrow">'+
        // 効果音の種類：①シンプル ②木琴と鐘 ③ロシア風。画面には数字だけ出す
        [1,2,3].map(n=>'<button class="tool th" data-th="'+n+'" aria-label="効果音の種類 '+n+'" aria-pressed="'+(PREFS.theme===n)+'"><b class="tv">'+'①②③'[n-1]+'</b></button>').join('')+
        '<button class="tool" id="spd" aria-label="読み上げの速さ"><b class="tv"></b><span>速さ</span></button>'+
      '</div>'+
    '</div>'+
    '<div class="q-setup"><h3>カラー</h3>'+
      '<div class="toolrow" id="lookrow">'+
        LOOKS.map(x=>'<button class="tool lk" data-look="'+x[0]+'" aria-label="'+x[1]+'" aria-pressed="'+(PREFS.look===x[0])+'">'+x[2]+'<span>'+x[1]+'</span></button>').join('')+
      '</div>'+
      '<div class="swrow" id="accrow">'+
        ACCENTS.map(k=>'<button class="sw" data-acc="'+k+'" aria-label="色 '+k+'" aria-pressed="'+(PREFS.accent===k)+'"><i></i></button>').join('')+
      '</div>'+
    '</div>'+
    '<div class="q-setup"><h3>記録</h3>'+recordHtml()+'</div>'+
    '<div class="q-setup"><h3>図鑑</h3>'+zukanHtml()+'</div>'+
    '<div class="q-setup" id="resetbox"><h3>初期化</h3>'+
      '<div class="rs"><span>苦手</span><i>'+Object.keys(WEAK).length+'語</i><button class="mini" data-r="weak">消す</button></div>'+
      '<div class="rs"><span>図鑑</span><i>'+Object.keys(ZUKAN).filter(inZukan).length+'語</i><button class="mini" data-r="zukan">消す</button></div>'+
      '<div class="rs"><span>判定</span><i>'+Object.keys(DAILY).length+'日</i><button class="mini" data-r="daily">消す</button></div>'+
      '<div class="rs"><span>すべて</span><button class="mini" data-r="all">消す</button></div>'+
    '</div>';
  spdLabel();
  // 名前はこの端末の中にだけ保存し、見出しの右に出す
  const un=document.getElementById('uname');
  un.oninput=()=>{ PREFS.name=un.value.trim(); whoLabel(); };
  un.onchange=()=>store.set(PKEY,PREFS);
  // カラー：明るさと色。選んだらすぐ当てて、端末に覚えておく
  document.getElementById('lookrow').addEventListener('click',e=>{
    const b=e.target.closest('.lk'); if(!b) return;
    PREFS.look=b.dataset.look; store.set(PKEY,PREFS); applyLook();
    document.querySelectorAll('#lookrow .lk').forEach(x=>x.setAttribute('aria-pressed',x===b));
    sfx('on');
  });
  document.getElementById('accrow').addEventListener('click',e=>{
    const b=e.target.closest('.sw'); if(!b) return;
    PREFS.accent=b.dataset.acc; store.set(PKEY,PREFS); applyLook();
    document.querySelectorAll('#accrow .sw').forEach(x=>x.setAttribute('aria-pressed',x===b));
    sfx('on');
  });
  const sv=document.getElementById('sv'), tv=document.getElementById('tv');
  sv.value=PREFS.sv; tv.value=PREFS.tv;
  // 音量の横バー：効果音は動かすたびにその大きさで1音鳴らす。読み上げは指を離したときに一言しゃべらせる
  sv.oninput=()=>{ const v=+sv.value; if(v===PREFS.sv) return; PREFS.sv=v; if(MASTER) MASTER.gain.value=v/5; sfx('tick'); };
  sv.onchange=()=>store.set(PKEY,PREFS);
  tv.oninput=()=>{ PREFS.tv=+tv.value; };
  tv.onchange=()=>{ store.set(PKEY,PREFS); if(PREFS.tv) say('привет','ru-RU'); };
  // 種類を選んだら、その種類の「テスト開始」の音を鳴らして聞かせる
  document.getElementById('sndrow').addEventListener('click',e=>{
    const b=e.target.closest('.th'); if(!b) return;
    PREFS.theme=+b.dataset.th; store.set(PKEY,PREFS);
    document.querySelectorAll('#sndrow .th').forEach(x=>x.setAttribute('aria-pressed',x===b));
    sfx('start');
  });
  document.getElementById('spd').onclick=()=>{ SPK.rate=SPK.rate===1?0.65:1; spdLabel(); sfx(SPK.rate===1?'off':'on'); };
  const wipe=o=>Object.keys(o).forEach(k=>delete o[k]);
  document.getElementById('resetbox').onclick=e=>{
    const b=e.target.closest('button[data-r]'); if(!b) return;
    if(!twice(b,'もう一度')) return;
    const r=b.dataset.r, all=r==='all';
    if(all||r==='weak'){ wipe(WEAK); wipe(MISS); store.set(WKEY,WEAK); store.set(MKEY,MISS); }
    if(all||r==='zukan'){ wipe(ZUKAN); store.set(ZKEY,ZUKAN); }
    if(all||r==='daily'){ wipe(DAILY); store.set(DKEY,DAILY); }
    if(all){ qclear(); quiz=null; PREFS.limit=0; PREFS.sv=5; PREFS.tv=10; PREFS.theme=1; PREFS.name=''; PREFS.look='auto'; PREFS.accent='mono'; store.set(PKEY,PREFS); if(MASTER) MASTER.gain.value=1; whoLabel(); applyLook(); }
    renderSettings();

        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(v,t0+(bell?0.006:0.003));
        g.gain.exponentialRampToValueAtTime(0.0001,t0+ring);
        (bell?[[1,1,ring],[2,.3,ring],[3,.1,ring]]:[[1,1,ring],[4,.25,d*0.5+0.04]]).forEach(([m,a,len])=>{
          const o=AC.createOscillator(), pg=AC.createGain();
          o.frequency.setValueAtTime(f0*m,t0);
          pg.gain.setValueAtTime(a,t0);
          if(!bell) pg.gain.exponentialRampToValueAtTime(0.001,t0+len);
          o.connect(pg); pg.connect(g);
          o.start(t0); o.stop(t0+ring+0.04);
        });
        return;
      }
      let s;
      if(w==='noise'){
        s=AC.createBufferSource(); s.buffer=NOISE;
        const bp=AC.createBiquadFilter();
        bp.type='bandpass'; bp.Q.value=0.8;
        bp.frequency.setValueAtTime(f0,t0);
        bp.frequency.exponentialRampToValueAtTime(f1,t0+d);
        s.connect(bp); bp.connect(g);
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(v,t0+d*0.3);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
      }else{
        s=AC.createOscillator(); s.type=w||'sine';
        s.frequency.setValueAtTime(f0,t0);
        if(f1!==f0) s.frequency.exponentialRampToValueAtTime(f1,t0+d);
        s.connect(g);
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(v,t0+0.008);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.03);
      }
      s.start(t0); s.stop(t0+d+0.05);
    });
  }catch(_){}
}
/* 声部が1つでも複数でも鳴らす（複数のときは、同時に鳴り始める） */
function playAll(x){ if(!x) return; if(Array.isArray(x[0][0])) x.forEach(play); else play(x); }
/* 名前で鳴らす。選んでいる種類の音を先に探し、なければ②の音を使う */
function sfx(name){ playAll([null,SFX_1,SFX,RUS.sfx][PREFS.theme][name]||SFX[name]); }
/* 高さ f（Hz）の音を1つ、選んでいる種類の音色で鳴らす */
const tone1=f=>[[f,f,.04,.2],[f,f,.07,.3,'mar'],[f,f,.2,.34,'bal']][PREFS.theme-1];
function note(f){ play([tone1(f)]); }
/* 横バーの1目盛りの音。①②は目盛りが上がるほど高い音（f）。
   ③は「コロベイニキ」の i 番目の音。右へ動かすと曲が進み、左へ動かすと戻る */
function slideNote(i,f){
  if(PREFS.theme!==3){ note(f); return; }
  const t=RUS.tune; play([RUS.b(t[((i%t.length)+t.length)%t.length],.1)]);
}
/* 軽い振動（Android のみ）。効果音の音量が 0 のときは震わせない */
function buzz(p){ try{ if(PREFS.sv&&navigator.vibrate&&touched()) navigator.vibrate(p); }catch(_){} }
/* 正解の音：①は毎回同じ2音。②は続けて正解するほど音が1段ずつ上がる（8連続で頭打ち。それ以上は耳に刺さるので上げない）。
   ③は続けて正解するほど民謡が先へ進む。②③は、3・5連続と、10連続からの5回ごとに飾りの音を足す */
const STEP=[523,587,659,784,880,1047,1175,1319];
function cheer(combo){
  const i=Math.max(0,Math.min(combo,STEP.length)-1), deco=combo===3||combo===5||(combo>=10&&combo%5===0);
  if(PREFS.theme===1) play([[784,784,.06,.24],[1047,1047,.12,.24]]);
  else if(PREFS.theme===3){
    // 正解のたびに「コロベイニキ」の後半が少しずつ先へ進む。ブーベンを添え、節目ではバヤンの和音を重ねる
    play(RUS.cheer[(combo-1)%RUS.cheer.length]);
    play(deco?[RUS.bub(.16,.16,.1),RUS.bub(.1,.2,.3)]:[RUS.bub(.1,.14,.09)]);
    if(deco) play(RUS.bay(RUS.Am,.34,.09,.34));
  }else{
    const f=STEP[i], seq=[[f,f,.07,.32,'bell'],[f*1.5,f*1.5,.16,.32,'bell']];        // その段の音と、5度上
    if(deco) seq.push([1568,1568,.06,.2,'bell'],[2093,2093,.06,.2,'bell'],[2637,2637,.3,.22,'bell']);
    play(seq);
  }
  buzz(combo>=3?[12,40,12]:12);
}
/* 触ったときの音。押した場所の種類で鳴らし分ける
   （オン・オフの切り替え、混ぜる、めくる、答え合わせ、開始、結果は、それぞれの処理の中で鳴らす。語のタップは読み上げが鳴るので足さない） */
document.addEventListener('click',e=>{
  const t=e.target, c=t.closest('.chip'), m=t.closest('.mode'), th=PREFS.theme;
  // ①は品詞もタブも同じ1音。②は品詞ごと・行き先ごとに音が変わる。③は民謡の一節になる
  if(c){ const i=[...chips.children].indexOf(c); if(th===3) play(RUS.chip[i%RUS.chip.length]); else note(th===1?587:CHIPNOTE[i%CHIPNOTE.length]); }
  else if(m){
    if(th===3) play(RUS.mode[m.dataset.m]||RUS.mode.list);
    else{ const p=MODENOTE[m.dataset.m]||[392,490]; play(th===1?[tone1(494)]:[tone1(p[0]),tone1(p[1])]); }
  }
  else if(t.closest('details.grp>summary')&&!t.closest('.gsel')) sfx(t.closest('details').open?'close':'open');
  else if(t.closest('.toolsbtn,.mini,.opt,.gsel,.clear,.again button,.cal button,.q-bar button,.tool:not([aria-pressed])')) sfx('tick');
},true);

/* 連続日数：1日1セットで1日ぶん伸びる。1日だけ空いた日は、月2回までの「休み」で埋まって途切れない */
function streakInfo(){
  const has=x=>!!DAILY[dkey(x)];
  const d=new Date(); d.setHours(12,0,0,0);
  const cur=d.getFullYear()+'-'+d.getMonth();
  if(!has(d)) d.setDate(d.getDate()-1);            // 今日がまだなら、きのうまでの続きを数える
  let n=0; const used={};
  for(let i=0;i<3700;i++){
    if(has(d)) n++;
    else{
      const m=d.getFullYear()+'-'+d.getMonth(), prev=new Date(d); prev.setDate(prev.getDate()-1);
      if(has(prev)&&(used[m]||0)<2) used[m]=(used[m]||0)+1; else break;
    }
    d.setDate(d.getDate()-1);
  }
  return {n:n,rest:2-(used[cur]||0)};
}
function streakText(){ const s=streakInfo(); return '連続 '+s.n+' 日（今月の休み あと'+s.rest+'回）'; }

/* 日ごとの記録：カレンダー（1列＝1週間、上が月曜。直近18週）。色が濃いほど判定が高い。マスを押すと下に内訳が出る */
function recordHtml(){
  const WEEKS=18, now=new Date(); now.setHours(12,0,0,0);
  const start=new Date(now); start.setDate(now.getDate()-((now.getDay()+6)%7)-7*(WEEKS-1));     // 18週前の月曜
  let cells='', months='', lastM=-1;
  for(let w=0;w<WEEKS;w++) for(let d=0;d<7;d++){
    const x=new Date(start); x.setDate(start.getDate()+w*7+d);
    const k=dkey(x), r=DAILY[k], t=k===dkey(now)?' t':'';
    if(d===0){ months+='<span>'+(x.getMonth()!==lastM?(x.getMonth()+1)+'月':'')+'</span>'; lastM=x.getMonth(); }
    if(x>now) cells+='<i class="day f"></i>';
    else if(!r) cells+='<i class="day'+t+'"></i>';
    else{
      const info=(x.getMonth()+1)+'/'+x.getDate()+'　'+r.r+'　'+r.raw+'点　正答率 '+Math.round(r.ok/r.n*100)+'%'+(r.t?'　平均 '+r.t+'秒':'');
      cells+='<button class="day r'+esc(r.r)+t+'" data-info="'+esc(info)+'" aria-label="'+esc(info)+'" aria-pressed="false"></button>';
    }
  }
  return '<div class="cal-m">'+months+'</div><div class="cal">'+cells+'</div>'+
    '<div class="cal-l"><span>C</span><i class="day rC"></i><i class="day rB"></i><i class="day rA"></i><i class="day rS"></i><span>S</span></div>'+
    '<div class="rec-info"></div>';
}

/* 図鑑：別々の日に2回、制限時間内に正解した語だけが載る。品詞ごとに何語埋まったかを出す */
function zukanHtml(){
  let got=0, half=0;
  const rows=D.map(p=>{
    let n=0, tot=0;
    p.groups.forEach(g=>g[1].forEach(w=>{ const e=ZUKAN[p.id+'|'+w[0]]; tot++; if(e&&e[1]>=2) n++; else if(e) half++; }));
    got+=n;
    return '<div>'+esc(p.name)+'</div><div class="bar"><i style="width:'+(n/tot*100)+'%"></i></div><div class="num">'+n+' / '+tot+'</div>';
  }).join('');
  return '<p>和 → 露で制限時間内に正解した日が2日になった語が載ります。<br>'+
    TOTAL.toLocaleString('ja-JP')+'語のうち <b>'+got+'</b> 語（あと1回で載る語 '+half+'）</p><div class="zk">'+rows+'</div>';
}

/* ================= quiz ================= */
let quiz=null, qDir='ru2ja', qLen=10, qLenLast=10, qScope='range', lastSaid='';     // qLen＝問題数（0 は全部）
let qTimerId=0, qT0=0;     // 制限時間のタイマーと、問題が出た時刻

/* ---- テストの途中経過を保存して、再読み込みでも続きから ---- */
const QKEY='rv-quiz-v1';
function qsave(){
  try{
    if(quiz&&quiz.i<quiz.items.length) localStorage.setItem(QKEY,JSON.stringify({t:Date.now(),dir:quiz.dir,q:quiz}));
    else localStorage.removeItem(QKEY);
  }catch(_){}
}
function qclear(){ try{ localStorage.removeItem(QKEY); }catch(_){} }
function qload(){
  try{
    const s=localStorage.getItem(QKEY); if(!s) return null;
    const o=JSON.parse(s);
    if(!o||!o.q||!Array.isArray(o.q.items)||!o.q.items.length) return null;
    if(o.q.i>=o.q.items.length) return null;
    if(Date.now()-o.t>7*864e5) return null;   // 1週間で破棄
    return o;
  }catch(_){ return null; }
}

function buildPool(){
  if(SEL.size){
    const a=[];
    D.forEach(p=>p.groups.forEach(([cat,ws])=>ws.forEach(w=>{if(SEL.has(p.id+'|'+w[0])) a.push({ru:w[0],ja:w[1],cat:cat,pos:p.id});})));
    return a;
  }
  const q=norm(query.trim()), arr=[], all=filter==='all';
  if(filter==='weak') return weakItems().filter(x=>hit([x.ru,x.ja],q,x.pos));
  D.forEach(p=>{
    if(!all&&filter!==p.id) return;
    p.groups.forEach(([cat,ws])=>ws.forEach(w=>{
      if(hit(w,q,p.id)) arr.push({ru:w[0],ja:w[1],cat:cat,pos:p.id});
    }));
  });
  return arr;
}
/* 範囲の名前 */
function scopeName(){ const p=D.find(p=>p.id===filter); return p?p.name:(filter==='weak'?'苦手':'全品詞'); }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* テスト1回ぶんの状態を作る。o＝{dir:出題方向, limit:制限時間（秒）, kind:'daily'（今日の10問）か 'free'}
   得点と2倍ボーナスは、制限時間つきのときだけ。図鑑に数えるのは、そのうち和→露のときだけ */
function makeQuiz(items,o){
  const limit=+o.limit||0;
  let x2=0;
  items=items.map(x=>{
    const y={ru:x.ru,ja:x.ja,cat:x.cat,pos:x.pos};
    // たまに出る「得点2倍」。頻度は低め（およそ8問に1回、1セットで2問まで）
    if(limit&&x2<2&&Math.random()<0.125){ y.x2=1; x2++; }
    return y;
  });
  return {items:items,i:0,wrong:[],ok:0,shown:false,dir:o.dir,limit:limit,kind:o.kind||'free',raw:0,pts:0,combo:0,best:0,tsum:0,tcnt:0};
}
function startQuiz(items,o){
  quiz=makeQuiz(items,o);
  sfx('start');
  lastSaid=''; qsave(); renderQuestion(); window.scrollTo({top:0});
}
/* 今日の10問：苦手な語（5語まで）と、まだ図鑑にない語を混ぜる */
function dailyItems(){
  const weak=shuffle(weakItems()).slice(0,5), used=new Set(weak.map(keyOf));
  let items=weak.concat(shuffle(ALL.filter(x=>!used.has(keyOf(x))&&!inZukan(keyOf(x)))).slice(0,10-weak.length));
  if(items.length<10){     // 図鑑がほぼ埋まったら、残りは全体から足す
    const have=new Set(items.map(keyOf));
    items=items.concat(shuffle(ALL.filter(x=>!have.has(keyOf(x)))).slice(0,10-items.length));
  }
  return shuffle(items);
}
function startDaily(){ startQuiz(dailyItems(),{dir:'ja2ru',limit:PREFS.limit||5,kind:'daily'}); }
/* 保存してあった途中のテストを、続きから出せる形に戻す */
function restoreQuiz(o){
  const z=Object.assign({dir:o.dir||'ru2ja',limit:0,kind:'free',raw:0,pts:0,combo:0,best:0,tsum:0,tcnt:0},o.q);
  if(!(z.shown&&z.late)){ z.shown=false; z.late=false; }     // 時間切れで答えが開いていた問題は、そのまま「次へ」から再開する
  z.wait=1;     // wait＝1問目だけ、少し間を置いてから計り始める
  return z;
}
/* 中断：途中経過は保存してあるので、テストの画面へ戻るだけ。「続きから」で再開できる */
function pauseQuiz(){
  clearTimeout(qTimerId);
  if(quiz){ if(!quiz.late) quiz.shown=false; qsave(); }
  quiz=null; render(); window.scrollTo({top:0});
}
/* 終了：ここまで答えたぶんで結果を出す。押し間違えないよう、2回押して確定する */
function endQuiz(e){
  if(!twice(e.currentTarget,'もう一度押すと終了')) return;
  clearTimeout(qTimerId);
  const z=quiz;
  // 時間切れで答えが開いている問題は「あやふや」として数えてから終える
  if(z.shown&&z.late){
    const it=z.items[z.i], k=keyOf(it);
    z.wrong.push(it); z.combo=0; z.i++;
    WEAK[k]=0; store.set(WKEY,WEAK);
    MISS[k]=(MISS[k]||0)+1; store.set(MKEY,MISS);
  }
  if(!z.i){ qclear(); quiz=null; render(); window.scrollTo({top:0}); return; }   // 1問も答えていなければ、テストの画面へ戻るだけ
  z.items=z.items.slice(0,z.i); z.cut=true; z.shown=false;     // 答えていない問題は数えない
  renderResult(); window.scrollTo({top:0});
}

    '<div class="q-bar"><button id="qpause">中断</button><button id="qend">終了</button></div>'+
    '<div class="q-top"><span><b>'+(z.i+1)+'</b> / '+z.items.length+'</span>'+
      (z.combo>=2&&!z.shown?'<span class="q-combo">'+z.combo+'連続</span>':'')+
      '<span>'+(timed?'得点 <b>'+z.pts+'</b>'+(z.gain&&!z.shown?'<i class="q-gain">+'+z.gain+'</i>':''):'正解 <b>'+z.ok+'</b>')+'</span></div>'+
    '<div class="q-prog'+(timed?' t':'')+'"><i style="width:'+(z.i/z.items.length*100)+'%"></i></div>'+
    (timed?'<div class="q-timer"><i id="qbar" style="transform:scaleX('+left+')"></i></div>':'')+
    '<div class="q-card">'+
      (it.x2?'<div class="q-x2">★ 得点2倍</div>':'')+
      (z.shown?'<div class="q-cat">'+esc(it.cat)+'</div>':'')+
      '<div class="q-prompt'+(ru2ja?'':' ja-side')+'"'+(ru2ja?' role="button" data-say="'+esc(sayTerm(it.ru))+'"':'')+'>'+promptTxt+'</div>'+
      (z.shown?'<div class="q-ans'+(ru2ja?'':' ru-side')+'"'+(ru2ja?'':' role="button" data-say="'+esc(sayTerm(it.ru))+'"')+'>'+ansTxt+'</div>':'')+
      (tip?'<div class="tip" style="text-align:left;margin:6px 0 0">'+tipHtml(tip)+'</div>':'')+
    '</div>'+
    // 時間切れで開いたときは自動で「あやふや」扱いにし、「次へ」だけを出す
    '<div class="q-btns">'+(!z.shown
      ? '<button class="reveal" id="rev">答えを見る</button>'
      : z.late
        ? '<button class="reveal" id="next">次へ</button>'
        : '<button class="ng" id="ng">✕ あやふや</button><button class="ok" id="ok">○ わかった</button>')+
    '</div>';
  if(it.x2&&!z.shown) setTimeout(()=>sfx('x2'),380);     // 前の問題の音と重ならないよう、少し遅らせる
  // ロシア語が画面に出た瞬間に一度だけ読み上げる
  const key=z.i+'|'+(z.shown?'a':'q');
  const visible = ru2ja ? !z.shown : z.shown;
  if(visible && lastSaid!==key){ lastSaid=key; say(sayTerm(it.ru),'ru-RU'); }
  document.getElementById('qpause').onclick=pauseQuiz;
  document.getElementById('qend').onclick=endQuiz;
  if(!z.shown) document.getElementById('rev').onclick=()=>reveal(false);
  else if(z.late) document.getElementById('next').onclick=()=>mark(false,true);
  else{
    document.getElementById('ok').onclick=()=>mark(true);
    document.getElementById('ng').onclick=()=>mark(false);
  }
  if(timed&&!z.shown){
    const i=z.i;
    const run=()=>{
      if(quiz!==z||z.i!==i||z.shown) return;
      // 画面が見えていない間は計り始めない
      if(document.hidden){ document.addEventListener('visibilitychange',run,{once:true}); return; }
      qT0=performance.now();
      const bar=document.getElementById('qbar');
      if(bar) bar.style.animation='drain '+z.limit+'s linear forwards';
      qTimerId=setTimeout(()=>reveal(true),z.limit*1000);
    };
    // 開いた直後の1問目だけ、画面を見る間を少し置いてから計り始める
    if(z.wait){ z.wait=0; qTimerId=setTimeout(run,1200); } else run();
  }
}

/* 答えを開く。auto＝制限時間が切れて自動で開いたとき */
function reveal(auto){
  const z=quiz;
  if(!z||z.shown||z.i>=z.items.length) return;
  clearTimeout(qTimerId);
  z.shown=true;
  sfx(auto?'late':'reveal');
  if(z.limit>0){
    z.late=!!auto;
    z.t=auto?z.limit:(qT0?Math.min(z.limit,(performance.now()-qT0)/1000):0);
    if(auto) qsave();     // 時間切れは保存しておく。開き直しても同じ問題をやり直せないようにする
  }
  renderQuestion();
}

/* 速さの点：問題が出てから答えを開くまでが短いほど高い（0.5秒以内で100点、1秒ごとに20点ずつ下がり、最低10点） */
const speedPts=t=>Math.max(10,Math.min(100,Math.round(100-20*(t-0.5))));

/* 答え合わせを記録して次へ進む。quiet＝時間切れのあとの「次へ」（時間切れの音はもう鳴っているので、間違いの音は重ねない） */
function mark(good,quiet){
  const z=quiz, it=z.items[z.i], k=keyOf(it), timed=z.limit>0;
  const inTime=good&&!(timed&&z.late);     // 正解で、制限時間つきなら時間内に自分で開いたとき
  z.gain=0;
  if(good){
    z.ok++;
    // 苦手な語は、「わかった」が2回続いたら外す
    if(k in WEAK){ if(++WEAK[k]>=2) delete WEAK[k]; store.set(WKEY,WEAK); }
  }else{
    z.wrong.push(it);
    WEAK[k]=0; store.set(WKEY,WEAK);
    MISS[k]=(MISS[k]||0)+1; store.set(MKEY,MISS);     // 間違えた回数は、苦手から外れても残す
    if(quiet) sfx('tick'); else{ sfx('wrong'); buzz(25); }
  }
  if(inTime){
    z.combo++; if(z.combo>z.best) z.best=z.combo;
    if(timed){
      const p=speedPts(z.t);
      z.raw+=p; z.gain=p*(it.x2?2:1); z.pts+=z.gain;
      z.tsum+=z.t; z.tcnt++;
      // 図鑑：和→露のときだけ数える。同じ日は1回ぶんで、別々の日に2回で載る
      if(z.dir==='ja2ru'){
        const d=today(), e=ZUKAN[k];
        if(!e) ZUKAN[k]=[d,1];
        else if(e[1]<2&&e[0]!==d){ e[0]=d; e[1]++; }
        store.set(ZKEY,ZUKAN);
      }
    }
    cheer(z.combo);
  }else{
    z.combo=0;
    if(good) sfx('done');     // 時間切れのあとの「わかった」
  }
  z.i++; z.shown=false; z.late=false;
  qsave();
  if(z.i>=z.items.length) renderResult(); else renderQuestion();
}

/* 判定：1問あたりの点（2倍ぶんを除く。不正解と時間切れは0点）の平均で決める */
const rankOf=a=>a>=80?'S':a>=60?'A':a>=40?'B':'C';

function renderResult(){
  clearTimeout(qTimerId);
  qclear();
  document.body.classList.remove('testing');
  const z=quiz, n=z.items.length, pct=Math.round(z.ok/n*100), timed=z.limit>0;
  const judged=z.kind==='daily'&&!z.cut;     // 今日の10問を途中で終了したときは、判定を付けない
  let html='';
  if(judged){
    // 1日1回の判定：その日の最初の1セットだけを記録する。判定と自己ベストは、2倍ぶんを除いた点で決める
    const d=today(), first=!DAILY[d], r=rankOf(z.raw/n), avg=z.tcnt?z.tsum/z.tcnt:0;
    const best=Object.values(DAILY).reduce((m,x)=>Math.max(m,x.raw||0),0);
    if(first){ DAILY[d]={r:r,raw:z.raw,ok:z.ok,n:n,t:Math.round(avg*10)/10}; store.set(DKEY,DAILY); }
    html+='<div class="rank-h">'+(first?'今日の判定':'練習（今日の判定は '+esc(DAILY[d].r)+' で記録済み）')+'</div>'+
      '<div class="rank">'+r+'</div>'+
      '<div class="score-sub">正答率 '+pct+'%　平均 '+(z.tcnt?avg.toFixed(1)+'秒':'—')+'　得点 '+z.pts+(z.pts!==z.raw?'（2倍ぶんを除くと '+z.raw+'）':'')+'</div>'+
      (first&&best>0&&z.raw>best?'<div class="score-sub">自己ベスト更新（これまで '+best+'点）</div>':'')+
      '<div class="score-sub">'+streakText()+(z.best>=3?'　最大 '+z.best+' 連続正解':'')+'</div>'+
      recordHtml();
  }else{
    html+='<div class="score">'+pct+'<small>%</small></div>'+
      '<div class="score-sub">'+n+'問中 '+z.ok+'問。'+(z.wrong.length?'取りこぼし '+z.wrong.length+'語':'全問クリア')+(timed?'　得点 '+z.pts:'')+'</div>'+
      (z.best>=3?'<div class="score-sub">最大 '+z.best+' 連続正解</div>':'')+
      (z.cut?'<div class="score-sub">途中で終了'+(z.kind==='daily'?'（今日の判定は付きません）':'')+'</div>':'');
  }
  if(z.wrong.length){
    html+='<div class="wrong-h">もう一度の語</div><ul class="list">'+
      z.wrong.map(w=>rowHtml([w.ru,w.ja],'',w.pos)).join('')+
      '</ul>';
  }
  html+='<div class="again">'+
    (z.wrong.length?'<button class="primary" id="redo">間違いだけ復習</button><button id="expwrong">間違えた語を書き出し</button>':'')+
    '<button id="new">'+(z.kind==='daily'?'テストの画面へ':'もう一度')+'</button><button id="back">一覧に戻る</button></div>';
  out.innerHTML=html;
  // 最後の問題の音が鳴り終わってから、結果の音を鳴らす
  setTimeout(()=>sfx(judged?'rank'+rankOf(z.raw/n):'done'),420);
  if(z.wrong.length){
    document.getElementById('redo').onclick=()=>startQuiz(shuffle(z.wrong.slice()),{dir:z.dir,limit:z.limit,kind:'free'});
    document.getElementById('expwrong').onclick=()=>showExport(z.wrong,'間違えた語');
  }
  document.getElementById('new').onclick=()=>{quiz=null;renderSetup();window.scrollTo({top:0});};
  document.getElementById('back').onclick=()=>{
    mode='list';quiz=null;
    [...modes.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.m==='list'));
    render();window.scrollTo({top:0});
  };
}

document.addEventListener('keydown',e=>{
  // 結果画面（quiz.i が最後まで進んだ状態）ではキーを受け付けない
  if(mode!=='quiz'||!quiz||quiz.i>=quiz.items.length||document.activeElement===qEl) return;
  if(!quiz.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal(false);}
  else if(quiz.shown&&quiz.late){ if(e.key===' '||e.key==='Enter'||e.key==='1'||e.key==='2'){e.preventDefault();mark(false,true);} }
  else if(quiz.shown&&e.key==='1'){mark(false);}
  else if(quiz.shown&&e.key==='2'){mark(true);}
});

const PAGELANG='ru-RU';
/* ================= 発音（ブラウザ内蔵の音声合成） ================= */
const SPK={rate:1,ok:null};
function voiceFor(lang){
  if(!window.speechSynthesis) return null;
  const vs=speechSynthesis.getVoices()||[];
  const full=lang.toLowerCase(), p=full.slice(0,2);
  return vs.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-')===full)
      || vs.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(p)) || null;
}
function spdLabel(){
  const b=document.getElementById('spd'); if(!b) return;
  // 端末にロシア語の音声がないときは「—」。ゆっくりのときはボタンを塗る
  b.querySelector('.tv').textContent=SPK.ok===false?'—':(SPK.rate===1?'1×':'0.65×');
  b.setAttribute('aria-pressed',SPK.ok!==false&&SPK.rate!==1);
}
function checkVoices(){
  if(!window.speechSynthesis){SPK.ok=false;spdLabel();return;}
  const vs=speechSynthesis.getVoices()||[];
  if(!vs.length) return;            // まだ読み込み中
  SPK.ok=!!voiceFor(PAGELANG);
  spdLabel();
}
function say(text,lang){
  if(!PREFS.tv) return;     // 読み上げの音量が 0 のときはしゃべらない
  if(!window.speechSynthesis){alert('この端末は読み上げに対応していません。');return;}
  try{speechSynthesis.cancel();}catch(_){}
  // Chrome は cancel 直後の speak を落とすことがあるので少し待つ
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    // 音量は1目盛りごとに差が分かるよう、耳の感じ方に合わせて下げる（1目盛り＝3.5デシベル。10 が最大、1 でかなり小さい）
    u.lang=lang; u.rate=SPK.rate; u.volume=PREFS.tv>=10?1:Math.pow(10,-(10-PREFS.tv)*3.5/20);
    const v=voiceFor(lang);
    if(v) u.voice=v;
    u.onerror=()=>{SPK.ok=false;spdLabel();};
    speechSynthesis.speak(u);
    setTimeout(()=>{
      if(SPK.ok===false&&!SPK.told){
        SPK.told=true;
        alert('端末に'+(PAGELANG.startsWith('ru')?'ロシア語':'英語')+'の音声データが入っていないため鳴りません。\n\nAndroid: 設定 → システム → 言語と入力 → テキスト読み上げ → 音声データをインストール\niPhone: 設定 → アクセシビリティ → 読み上げコンテンツ → 声');
      }
    },400);
  },60);
}
if(window.speechSynthesis){
  checkVoices();
  speechSynthesis.onvoiceschanged=checkVoices;
  [200,700,1500].forEach(t=>setTimeout(checkVoices,t));
}

/* ================= header collapse ================= */
let ticking=false;
addEventListener('scroll',()=>{
  if(ticking) return;
  ticking=true;
  requestAnimationFrame(()=>{
    // 縮む/戻るのしきい値を離して、境界での往復（ブルブル）を防ぐ
    const y=scrollY, on=document.body.classList.contains('scrolled');
    if(!on && y>110) document.body.classList.add('scrolled');
    else if(on && y<40) document.body.classList.remove('scrolled');
    ticking=false;
  });
},{passive:true});

/* ================= dispatcher ================= */
function render(){
  clearTimeout(qTimerId);
  applySheet();
  weakChip();
  if(mode==='set') renderSettings();
  else if(mode==='quiz'){
    if(quiz&&quiz.i>=quiz.items.length) quiz=null;     // 終わったテストは描き直さない
    quiz?renderQuestion():renderSetup();
  }
  else renderList();
}

/* 開いたとき：途中のテストがあれば続きから。なければ、まだ済んでいない日は「今日の10問」をすぐ始める */
(function(){
  const o=qload();
  if(o) quiz=restoreQuiz(o);
  else if(!DAILY[today()]){
    quiz=makeQuiz(dailyItems(),{dir:'ja2ru',limit:PREFS.limit||5,kind:'daily'});
    quiz.wait=1; qsave();
  }
  if(quiz){
    mode='quiz';
    [...modes.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.m==='quiz'));
  }
  render();
})();
